# CI 워크플로.
#
# 참고(A5): db-test 잡이 `supabase start` 기반 로컬 스택을 띄워
# tests/schema.test.ts의 DB 스모크를 실제로 실행한다. REQUIRE_DB_TESTS=1을
# 주입해 env 배선이 깨져 접속 정보가 비면 skip이 아니라 명시적으로
# 실패하도록 만든다(스펙: "env 없다고 전부 skip 금지").
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test / Lint / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if node -e "process.exit((require('./package.json').scripts || {}).lint ? 0 : 1)"; then
            npm run lint
          else
            echo "lint script not found in package.json — skipping"
          fi

      - name: Test
        env:
          # P3-1: tests/guard.test.ts 의 Cloudflare 공식 테스트 키 실제 siteverify 스모크를 연다(없으면 skip — 오픈까지 실키 경로가 한 번도 안 돈다).
          GUARD_LIVE_TESTS: "1"
        run: npm test

      - name: Type check (next typegen → tsc --noEmit)
        # 빌드 대신 타입 게이트만. P2-4 부터 홈이 ISR 이라 `next build` 가 빌드 타임에 Supabase 를 읽는다 —
        # env 없는 이 잡에서 빌드하면 깨진다. 실제 빌드는 legal-pages-http 잡이 로컬 Supabase 스택 위에서 한다.
        # next-env.d.ts 는 gitignore 라 체크아웃에 없다 — `next typegen`(15.5+, 앱 코드 실행 없음)이 그것과 .next/types 를 만든다.
        run: |
          npx next typegen
          npx tsc --noEmit

  pricing-regression-gate:
    name: Pricing Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden pricing symbols
        run: bash scripts/check-no-pricing.sh

  # P0-5 게이트 3종 — pricing-regression-gate 와 같은 형식, 서로 독립(needs 없음).
  # 원칙: 대상 파일이 없으면 exit 0, 생기는 순간부터 검사한다.
  legal-disclosures:
    name: Legal Disclosures Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check legal ledger (verbatim phrases, no function exports) and forbidden words
        run: bash scripts/check-legal-disclosures.sh

  mockup-drift:
    name: Mockup Drift Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check mockup hashes against baseline and brand asset parity
        run: bash scripts/check-mockup-drift.sh

  temp-values:
    name: Temp Values Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for unallowlisted temporary-value markers
        run: bash scripts/check-temp-values.sh

  db-test:
    name: DB Smoke (local Supabase stack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations (db reset)
        run: supabase db reset

      - name: Export local stack URL/key to GITHUB_ENV
        run: |
          # `supabase status -o env` 출력은 Go의 `%q` 스타일로 각 줄이
          # KEY="value" 형태다(값은 큰따옴표로 감싸짐). --override-name으로
          # 우리가 원하는 변수명을 직접 지정해두고(api.url, auth.service_role_key, auth.anon_key
          # 는 CLI가 인식하는 고정 필드 키), 그중 세 줄만 골라 따옴표를 벗겨
          # $GITHUB_ENV에 적재한다. 나머지(DB_URL 등)는 무시한다.
          # anon_key 는 P2-1 읽기 계층(lib/queries, anon+RLS)의 DB 테스트가 요구한다 —
          # 빠지면 tests/queries.test.ts 의 REQUIRE_DB_TESTS 가드가 의도대로 실패한다(run 34564058402).
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            > /tmp/supabase-status.env
          grep -E '^(NEXT_PUBLIC_SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|NEXT_PUBLIC_SUPABASE_ANON_KEY)=' /tmp/supabase-status.env \
            | sed -E 's/^([A-Za-z_]+)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"
          rm -f /tmp/supabase-status.env

      - name: Test (REQUIRE_DB_TESTS=1 — DB 스모크 skip 시 실패)
        env:
          REQUIRE_DB_TESTS: "1"
        run: npm test

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  # REVIEW-FIX M9 (2026-09-12) — 법정 3페이지 HTTP 검증 + M1(404 문서) + M8(/admin 캐시) 런타임 단언.
  # tests/legal-pages.test.ts §5(7건)와 tests/review-fix.test.ts 의 HTTP 블록은 LEGAL_BASE_URL 이 있을 때만 돈다.
  # 그 서버를 띄우는 잡이 이것뿐이다 — 이 잡이 없으면 그 테스트들은 CI 에서 영원히 skip 이다(리뷰 M9).
  # (2026-09-13 개정) P2-4 부터 홈이 ISR(revalidate=600) 이라 `next build` 가 빌드 타임에 Supabase 를 읽는다. 그래서 이 잡도 db-test 처럼
  # 로컬 Supabase 스택을 띄우고 그 URL/키를 env 로 준다. 원격 프로젝트 자격은 여기 오지 않는다(secrets.* 0건) — 빌드가 실DB 를 건드릴 길이 없다.
  # 법정 3페이지·404·/admin 이 DB 를 읽지 않는다는 단언은 env 부재가 아니라 tests/legal-pages.test.ts 의 정적 import 검사 + HTTP 블록이 맡는다.
  legal-pages-http:
    name: Legal Pages HTTP (build → start → fetch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations (db reset)
        run: supabase db reset

      - name: Export local stack URL/key to GITHUB_ENV
        run: |
          # db-test 잡과 같은 방식(포맷 설명은 그쪽 주석). 빌드(ISR 프리렌더)와 뒤의 프로덕션 서버 둘 다 이 env 를 본다.
          # 로컬 스택의 일회용 키다 — 원격 프로젝트 키가 아니므로 secrets 를 쓰지 않는다.
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            > /tmp/supabase-status.env
          grep -E '^(NEXT_PUBLIC_SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|NEXT_PUBLIC_SUPABASE_ANON_KEY)=' /tmp/supabase-status.env \
            | sed -E 's/^([A-Za-z_]+)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"
          rm -f /tmp/supabase-status.env

      - name: Build (로컬 Supabase 스택 env — 홈 ISR 프리렌더가 여기서 DB 를 읽는다)
        run: npm run build

      - name: Assert _not-found.html is a full document (M1)
        run: |
          f=.next/server/app/_not-found.html
          test -f "$f" || { echo "missing $f"; exit 1; }
          html=$(grep -c '<html' "$f"); body=$(grep -c '<body' "$f")
          echo "<html: $html / <body: $body"
          [ "$html" -ge 1 ] && [ "$body" -ge 1 ]

      - name: Start production server on :3111
        env:
          # P3-4: /quote 의 폼 토큰(타임트랩)은 요청마다 이 시크릿으로 서명된다. 일회용 문자열 — 원격 자격 아님(GitHub 시크릿 참조 0 유지).
          # 없으면 페이지가 fail-closed("접수 준비 중")로 토큰을 내리지 않아 아래 "요청마다 새 토큰" 단언을 할 수 없다.
          GUARD_SECRET: ci-only-throwaway-form-token-secret-0123456789abcdef
        run: |
          nohup npm start -- -p 3111 > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3111/; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not come up in 60s"; cat /tmp/next-start.log; exit 1

      - name: Assert /admin is gated and not CDN-cacheable (M8 + P5-1)
        run: |
          # P5-1 부터 세션 없는 /admin 은 200 이 아니라 /admin/login 으로의 리다이렉트다(requireAdmin).
          # -L 을 붙이지 않는다 — 리다이렉트 자체가 게이트가 살아 있다는 증거다. 캐시 단언(M8)은 두 응답 모두에 건다.
          h=$(curl -sD- -o /dev/null http://127.0.0.1:3111/admin)
          printf '%s\n' "$h"
          printf '%s\n' "$h" | grep -qE '^HTTP/1.1 30[27]' || { echo "/admin is not a redirect — 인증 게이트가 없다"; exit 1; }
          # Location 은 상대(/admin/login)로도 절대(http://host/admin/login)로도 올 수 있다 — Next 버전에 따라 달라진다(리뷰 N2).
          printf '%s\n' "$h" | grep -qiE '^location: (https?://[^/]+)?/admin/login' || { echo "/admin does not redirect to /admin/login"; exit 1; }
          if printf '%s\n' "$h" | grep -qi 's-maxage=31536000'; then echo "/admin carries s-maxage=31536000"; exit 1; fi
          if printf '%s\n' "$h" | grep -qi '^x-nextjs-prerender'; then echo "/admin is prerendered"; exit 1; fi
          l=$(curl -sD- -o /tmp/admin-login.html http://127.0.0.1:3111/admin/login)
          printf '%s\n' "$l"
          printf '%s\n' "$l" | grep -q '^HTTP/1.1 200' || { echo "/admin/login is not 200"; exit 1; }
          if printf '%s\n' "$l" | grep -qi 's-maxage=31536000'; then echo "/admin/login carries s-maxage=31536000"; exit 1; fi
          if printf '%s\n' "$l" | grep -qi '^x-nextjs-prerender'; then echo "/admin/login is prerendered"; exit 1; fi
          # ADMIN_EMAILS 가 없는 잡이므로 로그인은 닫힌 상태로 떠야 한다(fail-closed).
          grep -q 'disabled' /tmp/admin-login.html || { echo "/admin/login is open without ADMIN_EMAILS"; exit 1; }

      - name: Assert /quote is rendered per request (P3-4 — a baked form token would expire for everyone after 1h)
        run: |
          # 빌드 표는 이 라우트를 ●(SSG) 로 찍지만(Turbopack 이 generateStaticParams 하위를 그렇게 표기) 실제 판정은 런타임이다:
          # prerender 산출물 없음 + no-store + 두 요청의 formToken 이 다르면 동적이다. 같으면 토큰이 HTML 에 구워진 것 — 1시간 뒤 전원 bot.
          a=$(curl -s -D /tmp/quote.h "http://127.0.0.1:3111/quote?step=6"); b=$(curl -s "http://127.0.0.1:3111/quote?step=6")
          grep -q '^HTTP/1.1 200' /tmp/quote.h || { echo "/quote is not 200"; cat /tmp/quote.h; exit 1; }
          grep -qi '^cache-control:.*no-store' /tmp/quote.h || { echo "/quote is cacheable"; cat /tmp/quote.h; exit 1; }
          ta=$(printf '%s' "$a" | grep -o '<input[^>]*name="formToken"[^>]*>' | grep -o 'value="[^"]*"' | head -1)
          tb=$(printf '%s' "$b" | grep -o '<input[^>]*name="formToken"[^>]*>' | grep -o 'value="[^"]*"' | head -1)
          [ -n "$ta" ] || { echo "no formToken hidden input — GUARD_SECRET missing or step 6 not rendered"; exit 1; }
          [ "$ta" != "$tb" ] || { echo "same formToken on two requests — /quote is prerendered"; exit 1; }
          printf '%s' "$a" | grep -q 'data-legal="withdrawal-notice"' || { echo "withdrawal notice missing on /quote"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3111/quote/done?code=ABCDEFGH")
          [ "$code" = "200" ] || { echo "/quote/done -> $code"; exit 1; }
          echo "/quote: 200, no-store, two requests -> two tokens, withdrawal notice present; /quote/done 200"

      - name: Assert every public route answers 200 (P6-3 — legacy menu "삭제 금지, 재배치만" must not hide a 404 behind a live link)
        run: |
          # lib/legacy-menu-map.ts 의 ready:true 항목이 가리키는 경로 + 예약확인. 여기 없는 경로가 ready 로 올라가면 tests/layout.test.ts 가 잡고,
          # 여기 있는 경로가 죽으면 이 step 이 잡는다. 존재하지 않는 공지 id 는 404 문서여야 한다(열거·색인 방지).
          for p in /about /fleet /fares /notices /gallery /reservation/check /guide /privacy /terms; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3111$p")
            [ "$code" = "200" ] || { echo "$p -> $code (expected 200)"; exit 1; }
            echo "$p -> 200"
          done
          # 없는 공지 id 는 404 여야 한다. 문서 껍데기(<html lang>)는 여기서 단언하지 않는다 —
          # 라우트에 매칭된 페이지가 notFound() 를 부르면 Next 가 우리 껍데기 대신 __next_error__ 를 내는 것이
          # 이 저장소 구조(root layout 이 <html> 을 만들지 않고 [locale]/layout.tsx 가 만든다)의 알려진 결함이다.
          # 실측·원인·선택지는 docs/ops/known-defects.md D1. 매칭되지 않는 URL(아래 M1 step)은 정상이다.
          code=$(curl -s -o /tmp/nf.html -w '%{http_code}' "http://127.0.0.1:3111/notices/does-not-exist")
          [ "$code" = "404" ] || { echo "/notices/does-not-exist -> $code (expected 404)"; exit 1; }
          echo "/notices/does-not-exist -> 404 (document shell: known defect D1)"

      - name: Assert 404 responses are full documents (M1)
        run: |
          for p in /no-such-page /fr /ko-KR/x; do
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' "http://127.0.0.1:3111$p")
            [ "$code" = "404" ] || { echo "$p -> $code (expected 404)"; exit 1; }
            grep -q '<html[^>]* lang=' /tmp/body.html || { echo "$p: no <html lang>"; head -c 300 /tmp/body.html; exit 1; }
            grep -q '<body' /tmp/body.html || { echo "$p: no <body>"; exit 1; }
            echo "$p -> 404 with <html lang> + <body>"
          done

      - name: Legal pages + review-fix HTTP tests (skip 0)
        env:
          LEGAL_BASE_URL: http://127.0.0.1:3111
        run: |
          npx vitest run tests/legal-pages.test.ts tests/review-fix.test.ts 2>&1 | tee /tmp/vitest.log
          if grep -qE '[0-9]+ skipped' /tmp/vitest.log; then echo "skipped tests present — the LEGAL_BASE_URL gate did not open"; exit 1; fi

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then kill "$(cat /tmp/next.pid)" 2>/dev/null || true; fi
          pkill -f "next start" 2>/dev/null || true

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
